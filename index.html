<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prisma Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* pixel look: square corners, 4px "notched" borders made of 4 offset shadows, flat colours with inset bevels */
html,body{margin:0;height:100%;background:#12062b;overflow:hidden;touch-action:none;font-family:Fredoka,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block}
.card h2,.big,#cTitle,.pt{font-family:"Press Start 2P",monospace;font-weight:400}
.px{image-rendering:crisp-edges;image-rendering:pixelated}
.px{display:block}
.card,button,.bubble,.wtitle,.b-say{--bd:#0d0626;--bev:inset 0 -4px rgba(0,0,0,.3),inset 0 4px rgba(255,255,255,.22);box-shadow:0 -4px var(--bd),0 4px var(--bd),-4px 0 var(--bd),4px 0 var(--bd),var(--bev)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,2,20,.8);z-index:5}
.ov.on{display:flex;animation:fade .25s steps(4)}
#over{z-index:7}#ad{z-index:8}
@keyframes fade{from{opacity:0}}
.card{background:#2c1670;--bd:#cbb6ff;--bev:inset 0 0 0 4px #4a2596,inset 0 -8px #1d0f4a,0 0 0 8px #0d0626;padding:28px 22px 22px;text-align:center;width:300px;max-width:84vw;animation:pop .3s steps(4)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:4px 0 12px;font-size:16px;line-height:1.6;color:#ffd60a;text-shadow:3px 3px 0 #a35a00,6px 6px 0 #0d0626}
.big{font-size:40px;margin:8px 0 12px;color:#b7e6ff;text-shadow:4px 4px 0 #1d0f4a}
.muted{opacity:.8;font-weight:500}
.nm{color:#ffd60a;font-weight:600;margin-top:6px;min-height:1.2em}
button{font-family:inherit;display:block;width:100%;margin:16px 0 0;padding:14px;border:0;border-radius:0;font-size:21px;font-weight:700;color:#fff;cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.35);background:#5b33b8}
.b1{background:#1fc46a;animation:pulse .8s steps(2) infinite}
.b2{background:#6a3cf0}
.b3{background:#f09a00}
button:active{transform:translateY(4px);--bev:inset 0 4px rgba(0,0,0,.3)}
@keyframes pulse{50%{transform:scale(1.05)}}
#bar{position:fixed;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:3;padding:0 16px}
#bar button{position:relative;width:auto;flex:0 1 72px;margin:0;padding:6px 0 4px;font-size:26px;line-height:1.1;background:#4a2596}
#bar button.mus{flex:0 1 52px;background:#2e1773}
#bar button small{display:block;font-size:12px;font-weight:600;opacity:.9}
#bar button b{position:absolute;top:-10px;right:-8px;min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;background:#ff3b5c;font-size:14px;line-height:22px;box-shadow:0 0 0 2px #0d0626}
#bar button b.ad{background:#14b85c}
#bar button b.none{background:#555}
#bar button.empty{opacity:.4;filter:grayscale(1)}
#bar button.armed{--bd:#ffd60a;animation:pulse .5s steps(2) infinite}
#bar button.got{animation:got .6s steps(4)}
@keyframes got{30%{transform:scale(1.35) rotate(-8deg)}}
#bar.nudge button{animation:pulse .5s steps(2) infinite}
.logo{font-size:24px!important}
.goals{list-style:none;display:table;text-align:left;padding:0;margin:10px auto 4px;font-size:17px;font-weight:600}.goals li{margin:5px 0}.goals li span{display:inline-block;width:22px;color:#ffd60a}.goals li.ok,.goals li.ok span{color:#1fe08a}.goals b{color:#fff}
#map{position:fixed;inset:0;z-index:6;display:none;overflow:hidden;background:#07031a}
#space{position:absolute;inset:0;touch-action:none}
.mhead span{white-space:nowrap}.zb{margin-left:auto;display:flex;gap:12px}.zb button{width:40px;padding:6px 0;font-size:18px}
.legend{position:absolute;top:84px;left:0;right:0;text-align:center;font-size:13px;opacity:.85;pointer-events:none;text-shadow:2px 2px 0 #000}
#pinfo{position:absolute;left:16px;right:16px;bottom:20px;max-width:420px;margin:0 auto;background:#1d0f4a;--bd:#cbb6ff;box-shadow:0 -4px var(--bd),0 4px var(--bd),-4px 0 var(--bd),4px 0 var(--bd),inset 0 -4px #0d0626;padding:14px 16px;text-align:center}
#pinfo:empty{display:none}.pt{font-size:12px;line-height:1.6;color:#ffd60a}.pr{font-size:15px;margin-top:6px}#pinfo button{margin-top:12px;padding:11px}
#map.on{display:block}
.mhead{position:relative;z-index:3;display:flex;align-items:center;gap:18px;padding:12px 18px;background:#1d0f4a;border-bottom:4px solid #0d0626;font-size:22px;font-weight:700}
.mhead button{width:auto;margin:0;padding:8px 14px;font-size:16px}
@keyframes bob{50%{translate:0 -4px}}
#cArt .px{margin:-12px auto 6px;animation:bob 1.2s steps(2) infinite}
#story{position:fixed;inset:0;z-index:9;display:none;align-items:flex-end;justify-content:center;background:rgba(5,2,20,.72);padding:16px 16px 48px}
#story.on{display:flex;animation:fade .25s steps(4)}
.scard{display:flex;align-items:flex-end;gap:16px;max-width:460px;width:100%;animation:pop .3s steps(4)}
.who{flex:none;animation:bob 1s steps(2) infinite}
.bubble{flex:1;background:#fff;color:#2a1460;--bd:#1d0f4a;--bev:inset 0 -4px #d8ccff;padding:14px 16px 14px;position:relative;margin-bottom:30px}
.bubble b{color:#8a5cff;font-size:19px}
.who.grison+.bubble b{color:#5b606e}
.bubble p{margin:6px 0 14px;font-size:17px;line-height:1.35;font-weight:500}
.bubble p b{font-size:inherit}
.bubble button{margin:0;padding:11px;font-size:17px}
.bubble:before{content:'';position:absolute;left:-16px;bottom:24px;width:12px;height:8px;background:#1d0f4a;box-shadow:4px -4px 0 #fff,4px 0 0 #fff,4px 4px 0 #1d0f4a}
#buddy{position:fixed;z-index:4;pointer-events:none;display:none}
#buddy.jump .b-art{animation:jump .4s steps(4)}
@keyframes jump{30%{transform:translateY(-16px)}60%{transform:translateY(0)}}
.b-say{position:absolute;right:100%;top:6px;margin-right:8px;background:#fff;color:#2a1460;--bd:#1d0f4a;--bev:0 0 #0000;font-weight:700;font-size:13px;padding:6px 10px;white-space:nowrap;opacity:0;transform:scale(.5);transform-origin:right bottom;transition:.15s steps(3)}
.b-say.on{opacity:1;transform:none}
#pause{position:fixed;left:14px;width:40px;height:40px;margin:0;padding:0;font-size:18px;z-index:4;background:#4a2596}
#hint{position:fixed;left:0;right:0;text-align:center;font-weight:600;color:#ffd60a;z-index:3;pointer-events:none;text-shadow:2px 2px 0 #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<button id="pause" aria-label="Pausa">⏸</button>
<div id="bar"></div>
<div class="ov" id="over"><div class="card">
  <div id="cArt"></div>
  <h2 id="cTitle"></h2>
  <div class="big" id="cBig"></div>
  <div id="cSub" class="muted"></div>
  <div id="cNear" class="nm"></div>
  <div id="cBtns"></div>
</div></div>
<div id="map"><canvas id="space"></canvas><div class="mhead"><button class="b2" id="mapBack">←</button><span>🚀 Aventura</span><span class="zb"><button id="zOut" aria-label="Alejar">−</button><button id="zIn" aria-label="Acercar">+</button><button id="zHome" aria-label="Ir al siguiente planeta">◎</button></span></div><div class="legend">🟢 Fácil · 🟡 Normal · 🔴 Difícil · 👑 Jefe</div><div id="pinfo"></div></div>
<div id="story"></div>
<div id="buddy"><div class="b-say"></div><div class="b-art"></div></div>
<div class="ov" id="ad"><div class="card">
  <h2 id="adTitle">Anuncio</h2>
  <div class="muted">Simulación: aquí va el SDK real (AdMob / Poki / CrazyGames)</div>
  <div class="big" id="adCount">3</div>
</div></div>
<script src="core.js?v=8"></script>
<script src="art.js?v=8"></script>
<script>
'use strict';
// ---------- storage & analytics ----------
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
function log(name, params = {}) {
  let ev = []; try { ev = JSON.parse(ls('pp_events') || '[]'); } catch (e) {}
  ev.push({ t: Date.now(), name, ...params });
  ls('pp_events', JSON.stringify(ev.slice(-500))); // shortcut: local only, replace with Firebase/GA4 when published
}
const today = new Date().toISOString().slice(0, 10);
if (!ls('pp_install')) ls('pp_install', Date.now());
const daysSinceInstall = Math.floor((Date.now() - (+ls('pp_install') || Date.now())) / 864e5);
(() => {
  const last = ls('pp_lastday'), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  let s = +ls('pp_daystreak') || 0;
  s = last === today ? s : last === y ? s + 1 : 1;
  ls('pp_daystreak', s); ls('pp_lastday', today);
})();
const dayStreak = +ls('pp_daystreak') || 1;

// colours [base, light, dark]: 1-7 pieces, 8 stone, 9 ice (rules live in core.js)
const COLORS = [['#ff3b5c', '#ff9db0', '#a8002a'], ['#ff8a00', '#ffcc7a', '#a85400'], ['#ffd000', '#fff3a3', '#a88700'], ['#1fe08a', '#9dffd0', '#08834a'],
  ['#00c8ff', '#9becff', '#006ea8'], ['#8a5cff', '#cbb6ff', '#4417bd'], ['#ff4fd8', '#ffb0f0', '#a8007f'], ['#7d8494', '#b9bfcc', '#3e4350'], ['#8fe3ff', '#eafaff', '#3fa6d1']];

// ---------- game state ----------
let board = newBoard(), grid = board.g, tray = [null, null, null], score = 0, best = +ls('pp_best') || 0, streak = 0, movesNoClear = 0, revived, gameStartT, newBest, oldBest, recordShown;
let landT = emptyGrid();
let mode = 'classic', lvl = null, movesLeft = 0, gemsGot = 0, iceGot = 0, plusUsed = false, won = false;
const S = { games: 0, start: Date.now() };
const levelCache = new Map(), getLevel = n => levelCache.get(n) || levelCache.set(n, makeLevel(n)).get(n);
let starsMap = {}; try { starsMap = JSON.parse(ls('pp_stars')) || {}; } catch (e) {}
// difficulty: classic grows with score, adventure comes from the level number; never tied to ad value
const difficulty = () => mode === 'level' ? lvl.d * 0.6 : Math.min(1, score / 4000);
function newTray() { tray = dealTray(grid, Math.random, difficulty()); trayIn = 0; }
function newGame() {
  board = mode === 'level' ? cloneBoard(lvl.B) : newBoard(); grid = board.g; landT = emptyGrid(); buildBoardPath();
  score = 0; shownScore = 0; streak = 0; movesNoClear = 0; revived = false; newBest = false; recordShown = false; oldBest = best; gameStartT = Date.now();
  movesLeft = lvl ? lvl.moves : 0; gemsGot = 0; iceGot = 0; plusUsed = false; won = false; isOver = false;
  S.games++; newTray();
  log(mode === 'level' ? 'level_start' : 'game_start', { game_index: S.games, best, level: lvl ? lvl.n : 0 });
  armed = null; gameAdBoosts = 0; gameEarned = {}; $bar.classList.remove('nudge'); renderBar();
  $buddy.style.display = lvl ? 'block' : 'none'; wasDanger = false; buddyMood = ''; if (lvl) buddy('happy', '¡Vamos allá!');
  if (lvl) say(`Nivel ${lvl.n}`, cs * 0.9, lvl.n % 10 ? '#cbb6ff' : '#ff9db0', undefined, 1.6);
  if (dailyGift) { say(`🎁 Regalo diario: +1 ${BOOST[dailyGift].icon} ${BOOST[dailyGift].name}`, cs * 0.5, '#1fe08a', by + cs * 5.2, 2.5); dailyGift = null; }
}
function startClassic() { mode = 'classic'; lvl = null; N = 8; resize(); hideCard(); newGame(); }
function startLevel(n) { mode = 'level'; lvl = getLevel(n); N = lvl.size; resize(); hideCard(); $map.classList.remove('on'); newGame(); }
const goalsMet = () => score >= lvl.target && gemsGot >= lvl.goals.gems && iceGot >= lvl.goals.ice;
const starsFor = s => lvl.stars.filter(t => s >= t).length;
// level requirements as a bulleted list; during play (s given) each line shows progress and turns green with ✔ when met
function goalsHTML(L, g = 0, i = 0, s = null) {
  const row = (icon, txt, need, got) => { const ok = s !== null && got >= need;
    return `<li${ok ? ' class="ok"' : ''}><span>${ok ? '✔' : '•'}</span>${icon} ${txt}${s === null ? '' : ` <b>${Math.min(got, need)}/${need}</b>`}</li>`; };
  return `<ul class="goals">${row('🎯', `Consigue ${L.target} puntos`, L.target, s)}${L.goals.gems ? row('💎', `Recoge ${L.goals.gems} gemas`, L.goals.gems, g) : ''}${L.goals.ice ? row('🧊', `Rompe ${L.goals.ice} hielos`, L.goals.ice, i) : ''}</ul>`;
}

// ---------- audio / haptics ----------
let AC, noiseBuf;
function tone(f, d = 0.08, type = 'triangle', v = 0.15, delay = 0, f2) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}
function whoosh(v = 0.25, d = 0.4) {
  if (!AC) return;
  getNoise();
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(5000, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d);
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function getNoise() {
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6 | 0, AC.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { return; } }
  if (AC.state === 'suspended') AC.resume();
  Music.start();
}
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : AC.resume(); });

// ---------- music: procedural loop, faster and fuller on fire, muffled in danger ----------
const CHORDS = [[110, 130.81, 164.81], [87.31, 110, 130.81], [130.81, 164.81, 196], [98, 123.47, 146.83]]; // Am F C G
const LEAD = [4, -1, 2, -1, 1, -1, 2, 0, -1, 1, -1, 2, 4, -1, -1, -1]; // chord-tone index per 16th, -1 = rest
const Music = {
  on: ls('pp_music') !== '0', started: false, step: 0, next: 0, master: null, lp: null,
  start() {
    if (this.started || !AC) return; this.started = true;
    this.lp = AC.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 12000;
    this.master = AC.createGain(); this.master.gain.value = this.on ? 0.55 : 0;
    this.master.connect(this.lp).connect(AC.destination);
    this.next = AC.currentTime + 0.1;
    setInterval(() => this.tick(), 25);
  },
  set(on) { this.on = on; ls('pp_music', on ? '1' : '0'); this.duck(1); },
  duck(k) { if (this.master) this.master.gain.setTargetAtTime(this.on ? 0.55 * k : 0, AC.currentTime, 0.15); },
  tick() {
    if (AC.state !== 'running') return;
    const fire = streak >= 3, sp = 60 / (fire ? 128 : 108) / 4;
    this.lp.frequency.setTargetAtTime(grid && danger(fillRatio(grid)) ? 700 : 12000, AC.currentTime, 0.3);
    if (this.next < AC.currentTime) this.next = AC.currentTime + 0.05; // resync after a pause
    while (this.next < AC.currentTime + 0.12) { this.play(this.step, this.next, fire); this.next += sp; this.step = (this.step + 1) % 64; }
  },
  note(f, t, d, type, v, f2) {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + d + 0.02);
  },
  hit(t, d, v, freq, type) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = getNoise(); f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + d);
  },
  play(s, t, fire) {
    const st = s & 15, ch = CHORDS[s >> 4], tone4 = i => ch[i % 3] * (i >= 3 ? 8 : 4);
    if (st === 0) ch.forEach(f => this.note(f * 2, t, 2.4, 'sine', 0.03));                       // pad
    if ([0, 3, 8, 11].includes(st) || (fire && st % 2 === 0)) this.note(ch[0], t, 0.22, 'triangle', 0.16); // bass
    if (st % 2 === 0 || fire) this.note(ch[(st >> 1) % 3] * 4, t, 0.14, 'triangle', fire ? 0.03 : 0.022); // arp
    if (LEAD[st] >= 0 && (s >> 4) % 2 === 1) this.note(tone4(LEAD[st]), t, 0.3, 'sine', 0.05);    // lead on bars 2 and 4
    if (st === 0 || st === 8 || (fire && (st === 4 || st === 12))) this.note(150, t, 0.16, 'sine', 0.35, 42); // kick
    if (st % 4 === 2 || (fire && st % 2 === 1)) this.hit(t, 0.04, 0.05, 7000, 'highpass');                  // hat
    if (st === 4 || st === 12) this.hit(t, 0.12, fire ? 0.12 : 0.06, 1500, 'bandpass');                       // clap
  },
};

// ---------- effects state ----------
const parts = [], texts = [], pops = [], beams = [], rings = [], confetti = [];
let shake = 0, flash = 0, flashColor = '#fff', freeze = 0, punch = 0, shownScore = 0, scorePulse = 0, trayIn = 1, lastSnap = '', thumpT = 0;
const PRAISE = ['', '¡Bien!', '¡Genial!', '¡Increíble!', '¡BRUTAL!', '¡PRISMÁTICO!', '¡IMPARABLE!'];
const hex = i => COLORS[i - 1][0];

function burst(x, y, col, n, power = 1) {
  for (let j = 0; j < n; j++) {
    const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 9) * power;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, life: 1, decay: 0.9 + Math.random() * 0.8, color: col, s: 2 + Math.random() * 5, star: Math.random() < 0.35 });
  }
}
function confettiRain(n) {
  for (let j = 0; j < n; j++) confetti.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 0.3, w: 6 + Math.random() * 6, h: 10 + Math.random() * 8, color: COLORS[Math.random() * 7 | 0][0], life: 3 });
}
function say(txt, size, color, y = by + cs * 4, life = 1.3) { texts.push({ x: W / 2, y, txt, size, color, life, max: life, big: true }); }

// ---------- place ----------
function place(i, r, c) {
  const p = tray[i];
  p.cells.forEach(([dr, dc]) => landT[r + dr][c + dc] = performance.now());
  const res = applyMove(board, p.cells, p.color, r, c), { rows, cols, n } = res;
  score += p.cells.length; tray[i] = null;
  if (mode === 'level') { movesLeft--; gemsGot += res.gems; iceGot += res.ice; }
  tone(200, 0.09, 'sine', 0.3, 0, 90); tone(1400, 0.02, 'square', 0.03); buzz(10);
  [streak, movesNoClear] = nextStreak(streak, movesNoClear, n);
  if (n) {
    if (streak === 3) grant('bomb', 'streak3');
    if (streak >= 5 && streak % 5 === 0) grant('prism', 'streak5');
    if (n >= 3) grant('hammer', 'lines3');
    rows.forEach(R => beams.push({ row: true, i: R, life: 1, color: hex(p.color) }));
    cols.forEach(C => beams.push({ row: false, i: C, life: 1, color: hex(p.color) }));
    res.hits.forEach((h, k) => hitFx(h, k * 0.012, 6 + n * 2, 0.8 + n * 0.25));
    let pts = linePoints(n, streak);
    const allClear = isEmpty(grid);
    if (allClear) pts += 500;
    score += pts; scorePulse = 1;
    const [ph, pw] = dims(p.cells), { x, y } = cellXY(r + ph / 2, c + pw / 2);
    texts.push({ x, y, txt: '+' + pts, life: 1, max: 1, size: cs * (0.6 + n * 0.1), color: '#fff' });
    rings.push({ x, y, life: 1, color: hex(p.color), max: cs * (3 + n * 1.5) });
    const pl = Math.min(6, n + streak - 1);
    if (allClear) { say('¡TABLERO LIMPIO!', cs * 0.95, '#ffd60a', undefined, 1.8); confettiRain(120); }
    else if (pl >= 2) say(PRAISE[pl], cs * (0.75 + pl * 0.12), hex(1 + (streak + n) % 7));
    if (streak >= 2) texts.push({ x: W / 2, y: by + cs * 5.1, txt: 'RACHA x' + streak, life: 1, max: 1, size: cs * 0.5, color: '#ffd60a', big: true });
    shake = Math.min(34, 6 + n * 7 + streak * 3);
    flash = Math.min(0.55, 0.15 + n * 0.12); flashColor = n >= 3 || streak >= 3 ? hex(p.color) : '#fff';
    punch = Math.min(0.09, 0.025 * n + 0.01 * streak);

const AdPacer = {
  lastAd: 0, session: 0,
  adsToday() { return +ls('pp_ads_' + today) || 0; },

resize(); renderBar(); showMenu(); requestAnimationFrame(frame);
</script>
