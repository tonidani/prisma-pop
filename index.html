<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prisma Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#12062b;overflow:hidden;touch-action:none;font-family:Fredoka,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas{display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(60,20,120,.75),rgba(5,2,20,.92));backdrop-filter:blur(6px);z-index:5}
.ov.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{background:linear-gradient(160deg,#4a2596,#1d0f4a);border:2px solid rgba(255,255,255,.18);border-radius:28px;padding:30px 24px 24px;text-align:center;width:300px;max-width:86vw;box-shadow:0 0 60px rgba(160,90,255,.45),inset 0 2px 0 rgba(255,255,255,.2);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 6px;font-size:34px;font-weight:700;background:linear-gradient(#fff6a8,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.big{font-size:64px;font-weight:700;margin:0 0 4px;text-shadow:0 0 24px rgba(120,200,255,.8),0 4px 0 rgba(0,0,0,.3)}
.muted{opacity:.75;font-weight:500}
.nm{color:#ffd60a;font-weight:600;margin-top:6px;min-height:1.2em}
button{font-family:inherit;display:block;width:100%;margin:14px 0 0;padding:15px;border:0;border-radius:18px;font-size:21px;font-weight:700;color:#fff;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.b1{background:linear-gradient(#5dff9e,#14b85c);box-shadow:0 6px 0 #0a7a3b,0 0 30px rgba(60,255,140,.55);animation:pulse .9s infinite}
.b2{background:linear-gradient(#a98bff,#6236e0);box-shadow:0 6px 0 #3a1d99}
button:active{transform:translateY(4px);box-shadow:none}
@keyframes pulse{50%{transform:scale(1.06)}}
#bar{position:fixed;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:3;padding:0 16px}
#bar button{position:relative;width:auto;flex:0 1 74px;margin:0;padding:6px 0 4px;border-radius:16px;font-size:26px;line-height:1.1;background:linear-gradient(#5b33b8,#2e1773);box-shadow:0 4px 0 #1a0b4a,inset 0 1px 0 rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.12)}
#bar button.mus{flex:0 1 54px;background:linear-gradient(#3a2a6e,#1e1448)}
#bar button small{display:block;font-size:11px;font-weight:600;opacity:.85}
#bar button b{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;border-radius:11px;background:#ff3b5c;font-size:13px;line-height:22px;box-shadow:0 2px 0 #8a0020}
#bar button b.ad{background:#14b85c;box-shadow:0 2px 0 #0a7a3b}
#bar button b.none{background:#555;box-shadow:none}
#bar button.empty{opacity:.4;filter:grayscale(1)}
#bar button.armed{border-color:#ffd60a;box-shadow:0 0 22px #ffd60a,0 4px 0 #1a0b4a;animation:pulse .6s infinite}
#bar button.got{animation:got .7s}
@keyframes got{30%{transform:scale(1.35) rotate(-8deg);box-shadow:0 0 30px #fff}}
#bar.nudge button{animation:pulse .5s infinite}
#hint{position:fixed;left:0;right:0;text-align:center;font-weight:600;color:#ffd60a;z-index:3;pointer-events:none;text-shadow:0 2px 6px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="bar"></div>
<div class="ov" id="over"><div class="card">
  <h2>¡Sin espacio!</h2>
  <div class="muted">Puntuación</div>
  <div class="big" id="oScore">0</div>
  <div id="oBest" class="muted"></div>
  <div id="oNear" class="nm"></div>
  <button class="b1" id="bRevive">▶ Revivir</button>
  <button class="b2" id="bAgain">Jugar de nuevo</button>
</div></div>
<div class="ov" id="ad"><div class="card">
  <h2 id="adTitle">Anuncio</h2>
  <div class="muted">Simulación: aquí va el SDK real (AdMob / Poki / CrazyGames)</div>
  <div class="big" id="adCount">3</div>
</div></div>
<script>
'use strict';
// ---------- storage & analytics ----------
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
function log(name, params = {}) {
  let ev = []; try { ev = JSON.parse(ls('pp_events') || '[]'); } catch (e) {}
  ev.push({ t: Date.now(), name, ...params });
  ls('pp_events', JSON.stringify(ev.slice(-500))); // shortcut: local only, replace with Firebase/GA4 when published
}
const today = new Date().toISOString().slice(0, 10);
if (!ls('pp_install')) ls('pp_install', Date.now());
const daysSinceInstall = Math.floor((Date.now() - (+ls('pp_install') || Date.now())) / 864e5);
(() => {
  const last = ls('pp_lastday'), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  let s = +ls('pp_daystreak') || 0;
  s = last === today ? s : last === y ? s + 1 : 1;
  ls('pp_daystreak', s); ls('pp_lastday', today);
})();
const dayStreak = +ls('pp_daystreak') || 1;

// ---------- shapes ----------
const N = 8;
// [base, light, dark]
const COLORS = [['#ff3b5c', '#ff9db0', '#a8002a'], ['#ff8a00', '#ffcc7a', '#a85400'], ['#ffd000', '#fff3a3', '#a88700'], ['#1fe08a', '#9dffd0', '#08834a'],
  ['#00c8ff', '#9becff', '#006ea8'], ['#8a5cff', '#cbb6ff', '#4417bd'], ['#ff4fd8', '#ffb0f0', '#a8007f']];
const BASE = ['#', '##', '###', '####', '#####', '##|##', '###|###|###', '#.|##', '#..|###', '###|.#.', '.##|##.', '##.|.##', '##|##|##', '#..|#..|###'];
const parse = s => s.split('|').flatMap((row, r) => [...row].map((ch, c) => ch === '#' ? [r, c] : null)).filter(Boolean);
const norm = cs => { const mr = Math.min(...cs.map(p => p[0])), mc = Math.min(...cs.map(p => p[1])); return cs.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]); };
const SHAPES = []; { const seen = new Set();
  for (const b of BASE) { let cs = parse(b); for (let i = 0; i < 4; i++) { cs = norm(cs.map(([r, c]) => [c, -r])); const k = JSON.stringify(cs); if (!seen.has(k)) { seen.add(k); SHAPES.push(cs); } } } }
const dims = cs => [Math.max(...cs.map(p => p[0])) + 1, Math.max(...cs.map(p => p[1])) + 1];

// ---------- board logic ----------
const emptyGrid = () => Array.from({ length: N }, () => Array(N).fill(0));
const fits = (g, cs, r, c) => cs.every(([dr, dc]) => { const R = r + dr, C = c + dc; return R >= 0 && R < N && C >= 0 && C < N && !g[R][C]; });
function fitsAnywhere(g, cs) { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (fits(g, cs, r, c)) return true; return false; }
function fullLines(g) {
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) { if (g[i].every(v => v)) rows.push(i); if (g.every(row => row[i])) cols.push(i); }
  return { rows, cols };
}
function linesIfPlaced(g, cs, r, c) { const t = g.map(row => row.slice()); cs.forEach(([dr, dc]) => t[r + dr][c + dc] = 1); return fullLines(t); }

// ---------- game state ----------
let grid, tray, score, best = +ls('pp_best') || 0, streak, movesNoClear, revived, gameStartT, newBest, oldBest, recordShown;
let landT = emptyGrid();
const S = { games: 0, start: Date.now() };
const BIG = SHAPES.filter(s => s.length >= 5);
// difficulty grows with score (same for every player, never tied to ad value): 0 at start, 1 at 4000 points
const difficulty = () => Math.min(1, score / 4000);
function newPiece() {
  const pool = Math.random() < difficulty() * 0.4 ? BIG : SHAPES;
  return { cells: pool[Math.random() * pool.length | 0], color: 1 + (Math.random() * COLORS.length | 0) };
}
function newTray() {
  const fill = grid.flat().filter(Boolean).length / (N * N), d = difficulty();
  tray = [0, 1, 2].map(() => {
    let p = newPiece();
    // soft help on a crowded board, fading out as difficulty rises
    for (let k = 0; fill > 0.45 && k < Math.round(6 * (1 - d)) && !fitsAnywhere(grid, p.cells); k++) p = newPiece();
    return p;
  });
  // fairness: never deal a trio where nothing fits if some shape could
  if (!tray.some(p => fitsAnywhere(grid, p.cells))) {
    const ok = SHAPES.filter(cs => fitsAnywhere(grid, cs));
    if (ok.length) tray[0].cells = ok[Math.random() * ok.length | 0];
  }
  trayIn = 0;
}
function newGame() {
  grid = emptyGrid(); score = 0; shownScore = 0; streak = 0; movesNoClear = 0; revived = false; newBest = false; recordShown = false; oldBest = best; gameStartT = Date.now();
  S.games++; newTray(); log('game_start', { game_index: S.games, best });
  armed = null; gameAdBoosts = 0; gameEarned = {}; $bar.classList.remove('nudge'); renderBar();
  if (dailyGift) { say(`🎁 Regalo diario: +1 ${BOOST[dailyGift].icon} ${BOOST[dailyGift].name}`, cs * 0.5, '#1fe08a', undefined, 2.5); dailyGift = null; }
}

// ---------- audio / haptics ----------
let AC, noiseBuf;
function tone(f, d = 0.08, type = 'triangle', v = 0.15, delay = 0, f2) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
}
function whoosh(v = 0.25, d = 0.4) {
  if (!AC) return;
  getNoise();
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(5000, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + d);
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
function getNoise() {
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.6 | 0, AC.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { return; } }
  if (AC.state === 'suspended') AC.resume();
  Music.start();
}
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : AC.resume(); });

// ---------- music: procedural loop, faster and fuller on fire, muffled in danger ----------
const CHORDS = [[110, 130.81, 164.81], [87.31, 110, 130.81], [130.81, 164.81, 196], [98, 123.47, 146.83]]; // Am F C G
const LEAD = [4, -1, 2, -1, 1, -1, 2, 0, -1, 1, -1, 2, 4, -1, -1, -1]; // chord-tone index per 16th, -1 = rest
const Music = {
  on: ls('pp_music') !== '0', started: false, step: 0, next: 0, master: null, lp: null,
  start() {
    if (this.started || !AC) return; this.started = true;
    this.lp = AC.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 12000;
    this.master = AC.createGain(); this.master.gain.value = this.on ? 0.55 : 0;
    this.master.connect(this.lp).connect(AC.destination);
    this.next = AC.currentTime + 0.1;
    setInterval(() => this.tick(), 25);
  },
  set(on) { this.on = on; ls('pp_music', on ? '1' : '0'); this.duck(1); },
  duck(k) { if (this.master) this.master.gain.setTargetAtTime(this.on ? 0.55 * k : 0, AC.currentTime, 0.15); },
  tick() {
    if (AC.state !== 'running') return;
    const fire = streak >= 3, sp = 60 / (fire ? 128 : 108) / 4;
    this.lp.frequency.setTargetAtTime(grid && danger(grid.flat().filter(Boolean).length / (N * N)) ? 700 : 12000, AC.currentTime, 0.3);
    if (this.next < AC.currentTime) this.next = AC.currentTime + 0.05; // resync after a pause
    while (this.next < AC.currentTime + 0.12) { this.play(this.step, this.next, fire); this.next += sp; this.step = (this.step + 1) % 64; }
  },
  note(f, t, d, type, v, f2) {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + d + 0.02);
  },
  hit(t, d, v, freq, type) {
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = getNoise(); f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + d);
  },
  play(s, t, fire) {
    const st = s & 15, ch = CHORDS[s >> 4], tone4 = i => ch[i % 3] * (i >= 3 ? 8 : 4);
    if (st === 0) ch.forEach(f => this.note(f * 2, t, 2.4, 'sine', 0.03));                       // pad
    if ([0, 3, 8, 11].includes(st) || (fire && st % 2 === 0)) this.note(ch[0], t, 0.22, 'triangle', 0.16); // bass
    if (st % 2 === 0 || fire) this.note(ch[(st >> 1) % 3] * 4, t, 0.14, 'triangle', fire ? 0.03 : 0.022); // arp
    if (LEAD[st] >= 0 && (s >> 4) % 2 === 1) this.note(tone4(LEAD[st]), t, 0.3, 'sine', 0.05);    // lead on bars 2 and 4
    if (st === 0 || st === 8 || (fire && (st === 4 || st === 12))) this.note(150, t, 0.16, 'sine', 0.35, 42); // kick
    if (st % 4 === 2 || (fire && st % 2 === 1)) this.hit(t, 0.04, 0.05, 7000, 'highpass');                  // hat
    if (st === 4 || st === 12) this.hit(t, 0.12, fire ? 0.12 : 0.06, 1500, 'bandpass');                       // clap
  },
};

// ---------- effects state ----------
const parts = [], texts = [], pops = [], beams = [], rings = [], confetti = [];
let shake = 0, flash = 0, flashColor = '#fff', freeze = 0, punch = 0, shownScore = 0, scorePulse = 0, trayIn = 1, lastSnap = '', thumpT = 0;
const PRAISE = ['', '¡Bien!', '¡Genial!', '¡Increíble!', '¡BRUTAL!', '¡PRISMÁTICO!', '¡IMPARABLE!'];
const hex = i => COLORS[i - 1][0];

function burst(x, y, col, n, power = 1) {
  for (let j = 0; j < n; j++) {
    const a = Math.random() * Math.PI * 2, sp = (2 + Math.random() * 9) * power;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, life: 1, decay: 0.9 + Math.random() * 0.8, color: col, s: 2 + Math.random() * 5, star: Math.random() < 0.35 });
  }
}
function confettiRain(n) {
  for (let j = 0; j < n; j++) confetti.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.4, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * 0.3, w: 6 + Math.random() * 6, h: 10 + Math.random() * 8, color: COLORS[Math.random() * 7 | 0][0], life: 3 });
}
function say(txt, size, color, y = by + cs * 4, life = 1.3) { texts.push({ x: W / 2, y, txt, size, color, life, max: life, big: true }); }

// ---------- place ----------
function place(i, r, c) {
  const p = tray[i];
  p.cells.forEach(([dr, dc]) => { grid[r + dr][c + dc] = p.color; landT[r + dr][c + dc] = performance.now(); });
  score += p.cells.length; tray[i] = null;
  tone(200, 0.09, 'sine', 0.3, 0, 90); tone(1400, 0.02, 'square', 0.03); buzz(10);
  const { rows, cols } = fullLines(grid), n = rows.length + cols.length;
  if (n) {
    streak++; movesNoClear = 0;
    if (streak === 3) grant('bomb', 'streak3');
    if (streak >= 5 && streak % 5 === 0) grant('prism', 'streak5');
    if (n >= 3) grant('hammer', 'lines3');
    const cleared = new Set();
    rows.forEach(R => { for (let C = 0; C < N; C++) cleared.add(R * N + C); beams.push({ row: true, i: R, life: 1, color: hex(p.color) }); });
    cols.forEach(C => { for (let R = 0; R < N; R++) cleared.add(R * N + C); beams.push({ row: false, i: C, life: 1, color: hex(p.color) }); });
    let k = 0;
    cleared.forEach(key => {
      const R = key / N | 0, C = key % N, col = hex(grid[R][C]), { x, y } = cellXY(R, C);
      pops.push({ x, y, ci: grid[R][C], life: 1, delay: k++ * 0.012 });
      burst(x + cs / 2, y + cs / 2, col, 6 + n * 2, 0.8 + n * 0.25);
      grid[R][C] = 0;
    });
    let pts = (n === 1 ? 20 : n * n * 15) * (1 + Math.max(0, streak - 1) * 0.5) | 0;
    const allClear = grid.every(row => row.every(v => !v));
    if (allClear) pts += 500;
    score += pts; scorePulse = 1;
    const [ph, pw] = dims(p.cells), { x, y } = cellXY(r + ph / 2, c + pw / 2);
    texts.push({ x, y, txt: '+' + pts, life: 1, max: 1, size: cs * (0.6 + n * 0.1), color: '#fff' });
    rings.push({ x, y, life: 1, color: hex(p.color), max: cs * (3 + n * 1.5) });
    const lvl = Math.min(6, n + streak - 1);
    if (allClear) { say('¡TABLERO LIMPIO!', cs * 0.95, '#ffd60a', undefined, 1.8); confettiRain(120); }
    else if (lvl >= 2) say(PRAISE[lvl], cs * (0.75 + lvl * 0.12), hex(1 + (streak + n) % 7));
    if (streak >= 2) texts.push({ x: W / 2, y: by + cs * 5.1, txt: 'RACHA x' + streak, life: 1, max: 1, size: cs * 0.5, color: '#ffd60a', big: true });
    shake = Math.min(34, 6 + n * 7 + streak * 3);
    flash = Math.min(0.55, 0.15 + n * 0.12); flashColor = n >= 3 || streak >= 3 ? hex(p.color) : '#fff';
    punch = Math.min(0.09, 0.025 * n + 0.01 * streak);
    freeze = n >= 2 ? 50 + n * 25 : 0; // hit-stop on multi-line clears
    const base = 440 * Math.pow(2, Math.min(streak, 12) / 12);
    for (let j = 0; j <= n + 1; j++) tone(base * Math.pow(2, [0, 4, 7, 12, 16, 19, 24][j % 7] / 12), 0.22, 'sine', 0.13, j * 0.055);
    for (let j = 0; j <= n; j++) tone(base * 2 * Math.pow(2, [0, 7, 12, 19][j % 4] / 12), 0.12, 'square', 0.025, 0.03 + j * 0.055);
    whoosh(0.18 + n * 0.06, 0.3 + n * 0.08);
    if (n >= 2) tone(140, 0.5, 'sine', 0.35, 0, 40);
    buzz(n >= 2 ? [40, 30, 60 + n * 20] : 35);
  } else if (++movesNoClear >= 3) streak = 0;
  if (score > best) { best = score; newBest = true; ls('pp_best', best); }
  if (newBest && !recordShown && oldBest > 0) {
    recordShown = true; say('¡NUEVO RÉCORD!', cs * 0.9, '#ffd60a', by + cs * 2.6, 2); confettiRain(160);
    [0, 4, 7, 12].forEach((s, j) => tone(523 * Math.pow(2, s / 12), 0.3, 'triangle', 0.15, 0.25 + j * 0.09)); buzz([60, 40, 60, 40, 120]);
  }
  if (tray.every(t => !t)) newTray();
  if (!tray.some(t => t && fitsAnywhere(grid, t.cells))) setTimeout(gameOver, 700);
}

// ---------- ad pacing ----------
const AdPacer = {
  lastAd: 0, session: 0,
  adsToday() { return +ls('pp_ads_' + today) || 0; },
  features() {
    const offers = +ls('pp_rw_offer') || 0, accepts = +ls('pp_rw_accept') || 0;
    return {
      games_in_session: S.games, session_len_s: (Date.now() - S.start) / 1e3 | 0,
      since_last_ad_s: this.lastAd ? (Date.now() - this.lastAd) / 1e3 | 0 : 9999,
      ads_today: this.adsToday(), ads_session: this.session, days_since_install: daysSinceInstall, day_streak: dayStreak,
      rewarded_opt_in_rate: offers ? accepts / offers : 0, last_score: score, score_ratio_best: best ? score / best : 0, new_best: newBest ? 1 : 0,
    };
  },
  // shortcut: hand-made tolerance score standing in for the XGBoost model, swap for m2cgen export once real data exists
  tolerance(f) {
    return 0.45 + Math.min(f.days_since_install, 7) * 0.04 + f.rewarded_opt_in_rate * 0.3 + Math.min(f.games_in_session, 6) * 0.03 - f.ads_today * 0.03 - f.new_best * 0.25;
  },
  decide() {
    const f = this.features();
    const allowed = f.games_in_session >= 3 && f.since_last_ad_s >= 90 && f.ads_session < 6; // hard limits the model can never override
    const random_arm = Math.random() < 0.1;
    const tol = this.tolerance(f);
    const show = allowed && (random_arm ? Math.random() < 0.5 : tol >= 0.6);
    log('ad_opportunity', { ...f, type: 'interstitial', tolerance: +tol.toFixed(3), allowed, random_arm, decision: show });
    return show;
  },
  shown(type) { this.lastAd = Date.now(); this.session++; ls('pp_ads_' + today, this.adsToday() + 1); log('ad_shown', { type }); },
};
function fakeAd(title, done) {

  }

  ctx.globalCompositeOperation = 'lighter';
  for (let i = beams.length - 1; i >= 0; i--) {
    const b = beams[i]; b.life -= dt * 2.2; if (b.life <= 0) { beams.splice(i, 1); continue; }
    const k = 1 - b.life, thick = cs * (0.4 + k * 1.4), len = cs * N * (0.3 + Math.min(1, k * 3) * 0.9);
    const x = b.row ? cx : bx + (b.i + 0.5) * cs, y = b.row ? by + (b.i + 0.5) * cs : cy;
    const g = b.row ? ctx.createLinearGradient(0, y - thick / 2, 0, y + thick / 2) : ctx.createLinearGradient(x - thick / 2, 0, x + thick / 2, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, b.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = b.life; ctx.fillStyle = g;
    b.row ? ctx.fillRect(x - len / 2, y - thick / 2, len, thick) : ctx.fillRect(x - thick / 2, y - len / 2, thick, len);
    ctx.fillStyle = '#fff'; ctx.globalAlpha = b.life * 0.9;
    b.row ? ctx.fillRect(x - len / 2, y - 2, len, 4) : ctx.fillRect(x - 2, y - len / 2, 4, len);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.restore(); // punch

  // tray (slides in, bobs)
  trayIn = Math.min(1, trayIn + dt * 3.5);
  for (let i = 0; i < 3; i++) {
    const p = tray[i]; if (!p || (drag && drag.i === i)) continue;
    const [h, w] = dims(p.cells), s = cs * TS, c = slotCenter(i), ok = fitsAnywhere(grid, p.cells);
    const k = Math.max(0, Math.min(1, trayIn * 1.6 - i * 0.25)), sc = easeBack(k);
    const bob = Math.sin(T * 2.4 + i * 1.7) * cs * 0.06;
    ctx.save(); ctx.translate(c.x, c.y + bob); ctx.scale(sc, sc);
    drawPiece(p, -w * s / 2, -h * s / 2, s, ok ? 1 : 0.25); ctx.restore();
  }
  if (drag) {
    const age = Math.min(1, (now - drag.t) / 120);
    ctx.shadowColor = hex(tray[drag.i].color); ctx.shadowBlur = 25;
    drawPiece(tray[drag.i], t.left, t.top, cs, 0.97, 0.85 + 0.15 * age); ctx.shadowBlur = 0;
  }

  // rings, particles, confetti
  ctx.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life -= dt * 2.4; if (r.life <= 0) { rings.splice(i, 1); continue; } ctx.globalAlpha = Math.min(1, r.life); ctx.strokeStyle = r.color; ctx.lineWidth = 3 + r.life * 10; ctx.beginPath(); ctx.arc(r.x, r.y, r.max * Math.max(0, 1 - r.life * r.life), 0, 7); ctx.stroke(); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.35 * dt * 60; p.vx *= 0.985; p.life -= dt * p.decay; if (p.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    if (p.star) star(p.x, p.y, p.s * 1.6); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (0.5 + p.life * 0.5), 0, 7); ctx.fill(); }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i]; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.rot += p.vr * dt * 60; p.life -= dt; if (p.life <= 0 || p.y > H + 30) { confetti.splice(i, 1); continue; }
    ctx.save(); ctx.globalAlpha = Math.min(1, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(Math.cos(p.rot * 2), 1); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // texts: elastic pop + wobble
  for (let i = texts.length - 1; i >= 0; i--) {
    const x = texts[i]; x.life -= dt; if (x.life <= 0) { texts.splice(i, 1); continue; }
    const age = x.max - x.life, k = Math.min(1, age / 0.22), sc = 0.2 + 0.8 * easeBack(k), rot = Math.sin(age * 18) * 0.1 * Math.exp(-age * 4);
    ctx.save(); ctx.translate(x.x, x.y - (x.big ? 0 : age * 50)); ctx.rotate(x.big ? rot : 0); ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, x.life * 2.5);
    ctx.font = `700 ${Math.round(x.size)}px Fredoka, system-ui`;
    ctx.lineJoin = 'round'; ctx.lineWidth = x.size * 0.16; ctx.strokeStyle = 'rgba(30,0,60,.85)'; ctx.strokeText(x.txt, 0, 0);
    const g = ctx.createLinearGradient(0, -x.size / 2, 0, x.size / 2); g.addColorStop(0, '#fff'); g.addColorStop(0.55, x.color); g.addColorStop(1, x.color);
    ctx.shadowColor = x.color; ctx.shadowBlur = x.big ? 30 : 10; ctx.fillStyle = g; ctx.fillText(x.txt, 0, 0);
    ctx.restore();
  }
  ctx.restore(); // shake

  // flash & danger vignette
  if (flash > 0.01) { ctx.globalAlpha = flash; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; flash *= Math.pow(0.0005, dt); }
  if (danger(fill) && !isOver) {
    const a = 0.25 + Math.sin(T * 7) * 0.12, v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(255,0,60,0)'); v.addColorStop(1, `rgba(255,0,60,${a})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    if (T - thumpT > 0.9) { thumpT = T; tone(70, 0.18, 'sine', 0.35, 0, 45); tone(60, 0.15, 'sine', 0.25, 0.16, 40); }
  }
  requestAnimationFrame(frame);
}
const danger = fill => fill > 0.66;
function pill(x, y, txt, color, align) {
  const w = ctx.measureText(txt).width + cs * 0.6, h = cs * 0.62, x0 = align === 'left' ? x : x - w;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.roundRect(x0, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = color; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(txt, x0 + w / 2, y + 1);
}

// ---------- self-check (open with ?test) ----------
if (location.search.includes('test')) {
  const g = emptyGrid(); console.assert(SHAPES.length > 20, 'shapes');
  for (let c = 0; c < 7; c++) g[3][c] = 1;
  console.assert(fits(g, [[0, 0]], 3, 7) && !fits(g, [[0, 0]], 3, 0) && !fits(g, [[0, 0], [0, 1]], 0, 7), 'fits');
  const L = linesIfPlaced(g, [[0, 0]], 3, 7); console.assert(L.rows.length === 1 && L.rows[0] === 3 && !L.cols.length, 'lines');
  console.log('PRISMA TESTS DONE');
}
resize(); newGame(); requestAnimationFrame(frame);
</script>
